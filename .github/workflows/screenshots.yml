name: Capture Play Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Record Pixel 8 Screenshots (Roborazzi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Record Play Store screenshots
        run: gradle :app:recordRoborazziDebug --tests "com.example.PlayStoreScreenshotsTest" --no-daemon --stacktrace

      - name: Upload Play Store Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-screenshots
          path: app/build/outputs/play-store-screenshots/*.png
          if-no-files-found: error
