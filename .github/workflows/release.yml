name: Build, Release & Publish to Google Play

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play track to upload to (requires PLAY_SERVICE_ACCOUNT_JSON secret)'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
          - none
      play_status:
        description: 'Google Play release status (use "draft" until app leaves initial draft state)'
        type: choice
        default: draft
        options:
          - draft
          - completed
      version_name:
        description: 'Optional versionName override (e.g. 1.0.0)'
        required: false
        type: string
      version_code:
        description: 'Optional versionCode override (must strictly increase for Google Play)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-and-publish:
    name: Build Signed AAB & Publish to Google Play
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-debug
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compute release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${VERSION_CODE}"
          fi

          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION_CODE=${VERSION_CODE}, VERSION_NAME=${VERSION_NAME}"

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets in the 'google-play' environment (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/upload-keystore.jks"

      - name: Build signed release AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Check Google Play service account secret
        id: play_check
        if: startsWith(github.ref, 'refs/tags/v') || inputs.play_track != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON secret is not set in the 'google-play' environment yet. Download the signed .aab artifact for manual first upload to Google Play Console, then add PLAY_SERVICE_ACCOUNT_JSON (see PUBLISHING.md) to enable automatic uploads."
          fi

      - name: Upload signed AAB to Google Play
        if: steps.play_check.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.kiefte.bahaicalendar
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: ${{ inputs.play_status || vars.PLAY_RELEASE_STATUS || 'draft' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-keystore.jks"
